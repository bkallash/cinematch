[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematch"
version = "0.1.0"
description = "A personalized movie and series recommendation web app"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "bkallash", email = "bayankallash@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "aiofiles>=24.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "numpy>=1.26.0",
  "openai>=1.40.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest",
  "pytest-asyncio",
  "twine>=6.1.0",
]

[project.scripts]
cinematch = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = true

[tool.setuptools.package-data]
app = [
  "data/*.json",
  "static/css/*.css",
  "static/images/*.svg",
  "templates/*.html",
  "templates/components/*.html",
]
